apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-requests-limits
spec:
  validationActions:
    - Deny

  evaluation:
    background:
      enabled: true
    admission:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  validations:
    - expression: >-
        object.spec.containers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.cpu) &&
          has(container.resources.limits.memory)
        )
      message: >-
        CPU and memory requests and limits are required for every container.