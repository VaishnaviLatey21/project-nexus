apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Require CPU and memory requests and limits for application containers.
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-resource-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Pod

      validate:
        message: >-
          CPU and memory requests and limits are required for every container.

        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
